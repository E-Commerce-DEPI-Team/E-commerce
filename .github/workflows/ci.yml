name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ruff pytest pandas
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q || [ $? -eq 5 ]   # exit code 5 = no tests collected yet
