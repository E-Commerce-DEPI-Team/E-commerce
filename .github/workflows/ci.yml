name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DWH_HOST: localhost
      DWH_PORT: "5432"
      DWH_USER: ci_user
      DWH_PASSWORD: ci_password
      DWH_DB: ci_db
      DBT_PROFILES_DIR: dbt_project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest dbt-core==1.12.6 dbt-postgres==1.11.0

      - name: Lint (ruff)
        run: ruff check .

      - name: Pytest (skipped if no tests yet)
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests/ folder yet, skipping"
          fi

      - name: dbt parse
        run: dbt parse --project-dir dbt_project

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Airflow image
        run: docker build -t olist-airflow:ci .
