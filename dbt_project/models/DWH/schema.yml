
version: 2

models:
  - name: dim_customer
    description: "Customer dimension. Grain: one row per customer_id. customer_unique_id supports grouping repeat purchases across customer address IDs."
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: customer_unique_id
        tests: [not_null]

  - name: dim_product
    description: "Product dimension. Grain: one row per product_id, including translated English category."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: product_category_name_english
        description: "English category; 'unknown' when Person 1 data has no category or no translation."
        tests: [not_null]

  - name: dim_seller
    description: "Seller dimension. Grain: one row per seller_id."
    columns:
      - name: seller_id
        tests: [not_null, unique]

  - name: dim_order_status
    description: "Small order status dimension. Grain: one row per distinct order_status."
    columns:
      - name: order_status
        tests: [not_null, unique]

  - name: dim_payment_type
    description: "Small payment type dimension. Grain: one row per distinct payment_type."
    columns:
      - name: payment_type
        tests: [not_null, unique]

  - name: dim_date
    description: "Role-playing date dimension. Grain: one row per calendar date, continuous (no gaps) from the first to the last date appearing in any order, shipping or review event."
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: full_date
        tests: [not_null, unique]
      - name: month_name
        tests: [not_null]
      - name: day_name
        tests: [not_null]
      - name: is_weekend
        description: "1 for Saturday/Sunday, otherwise 0."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: fact_sales
    description: "Sales fact. Grain: one row per order line (order_id + order_item_id). Item price and freight are not multiplied by payment/review rows."
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id
      - name: order_status
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: order_status
      - name: purchase_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: item_total_amount
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id

  - name: fact_orders
    description: "Order-level fact. Grain: one row per order (order_id). Holds delivery KPIs, item/payment totals and the latest review score once per order (fact_sales repeats order-level values on every item)."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: order_status
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: order_status
      - name: purchase_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: delivered_customer_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: estimated_delivery_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: review_score
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: is_late_delivery
        description: "1 = delivered after the estimated date, 0 = on time, NULL = not delivered yet."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: fact_payments
    description: "Payments fact. Grain: one row per payment installment/record (order_id + payment_sequential). Kept separate from sales to avoid fan-out."
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_sequential
        tests: [not_null]
      - name: payment_type
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: payment_value
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential

  - name: fact_reviews
    description: "Reviews fact. Grain: one row per review_id + order_id."
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - review_id
              - order_id
