olist:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DWH_HOST', 'dwh-db') }}"
      port: "{{ env_var('DWH_PORT', '5432') | as_number }}"
      user: "{{ env_var('DWH_USER') }}"
      password: "{{ env_var('DWH_PASSWORD') }}"
      dbname: "{{ env_var('DWH_DB') }}"
      schema: core
      threads: 4